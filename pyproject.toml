[project]
name = "lms-pipeline"
version = "1.0.0"
description = "Testable transformation logic for a Microsoft Fabric medallion pipeline (LMS student performance)"
requires-python = ">=3.10"
dependencies = ["pyspark>=3.5,<4.1"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 140
target-version = "py310"
extend-exclude = ["fabric"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
